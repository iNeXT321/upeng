# ===== AI Agent 平台一键编排（全栈） =====
# 用法：
#   docker compose --env-file .env up -d --build
# 访问：http://localhost:8080（前端），默认账号 admin / agent123（首次登录后请改密码）
# 组件：backend(8123) + frontend(8080→nginx) + mysql(数仓) + elasticsearch(schema关键词)
#       + milvus(schema向量) + ollama(embedding)

services:
  backend:
    build: .
    container_name: agent-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # 模型密钥：生产从 CI/Secret 管理注入，绝不写死
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      # JWT 密钥：>=32 字节；不配置则每次重启生成临时密钥（所有用户掉线）
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:-}
      AGENT_DEFAULT_PASSWORD: ${AGENT_DEFAULT_PASSWORD:-agent123}
      JAVA_OPTS: "-Xms512m -Xmx1200m -XX:+UseZGC"
      # 持久化：容器内 H2 文件（挂卷保留）
      AGENT_PERSISTENCE_URL: ${AGENT_PERSISTENCE_URL:-}
      # ===== 问数数据源与 schema 混合召回（compose 网络服务名寻址） =====
      NL2SQL_DB_URL: jdbc:mysql://mysql:3306/bi_warehouse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=60000
      NL2SQL_DB_USER: nl2sql_ro
      NL2SQL_DB_PASSWORD: ${NL2SQL_DB_PASSWORD:-nl2sql_ro_2026}
      NL2SQL_ES_BASE_URL: http://elasticsearch:9200
      NL2SQL_MILVUS_HOST: milvus
      NL2SQL_MILVUS_PORT: "19530"
      NL2SQL_EMBEDDING_BASE_URL: ${NL2SQL_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      NL2SQL_EMBEDDING_MODEL: ${NL2SQL_EMBEDDING_MODEL:-nomic-embed-text}
      NL2SQL_EMBEDDING_DIM: ${NL2SQL_EMBEDDING_DIM:-768}
    volumes:
      - agent-data:/app/data
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/api/ai/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s

  frontend:
    build: ./agent-frontend
    container_name: agent-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  # ===== 问数数仓（MySQL） =====
  mysql:
    image: mysql:8.0
    container_name: bi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bi_root_2026}
      MYSQL_DATABASE: bi_warehouse
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=80
      - --performance-schema=OFF
      - --skip-name-resolve
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表 + 灌入生产级仿真数据（含只读账号 nl2sql_ro）
      - ./deploy/infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-bi_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ===== schema 混合召回：关键词一路（BM25 + cjk 分词） =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: bi-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # ===== schema 混合召回：向量一路（HNSW + COSINE） =====
  # 官方 standalone 标准形态：etcd(元数据) + minio(对象存储) + standalone
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: bi-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - etcd-data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: bi-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 本地存储模式（rocksdb），省去 minio 依赖
      COMMON_STORAGETYPE: "local"
    depends_on:
      - etcd
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ===== embedding 服务（OpenAI 兼容 /v1/embeddings） =====
  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  agent-data:
  mysql-data:
  es-data:
  milvus-data:
  etcd-data:
  ollama-data:
